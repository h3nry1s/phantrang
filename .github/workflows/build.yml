# Builds Phấn Trắng with the C# compiler that ships with Windows and runs the self-tests.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # what someone who downloads the source does: double-click build.cmd
      - name: Build like a downloader (build.cmd)
        shell: cmd
        run: build.cmd

      - name: Build and test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\run-tests.ps1
