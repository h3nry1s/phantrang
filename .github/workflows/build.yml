# Builds Phấn Trắng with the C# compiler that ships with Windows, runs the self-tests, and packages it.
# On a version tag (v1.2.0 …) it also makes a GitHub Release.
#
# Signing with SignPath Foundation (free for open source) switches on by itself once the repository has:
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID
# The app is signed first, then packed into the installer, then the installer is signed: every .exe a teacher
# runs carries a signature, including the one the installer puts on disk.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write      # only used to publish a release on a tag
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      # what someone who downloads the source does: double-click build.cmd
      - name: Build like a downloader (build.cmd)
        shell: cmd
        run: build.cmd

      - name: Build and test
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests\run-tests.ps1

      - name: Upload app for signing
        id: app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: dist/PhanTrang.exe

      - name: Sign app (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: phantrang
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app

      - name: Use the signed app
        if: env.SIGN == 'true'
        shell: powershell
        run: Copy-Item signed-app\PhanTrang.exe dist\PhanTrang.exe -Force

      - name: Package (installer, portable zip, checksums)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File release.ps1 -SkipBuild -AllowUnsigned

      - name: Upload installer for signing
        id: setup
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: setup-unsigned
          path: dist/release/PhanTrang-Setup-*.exe

      - name: Sign installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: phantrang
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: powershell
        run: |
          Copy-Item signed-setup\*.exe dist\release\ -Force
          # signing changed the installer: record its new size and checksum for the download page
          $info = Get-Content dist\release\phien-ban.json -Raw | ConvertFrom-Json
          $setup = Get-Item (Join-Path dist\release $info.file)
          $info.sha256 = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $info.sizeMB = [Math]::Round($setup.Length / 1MB, 2)
          $info.signed = (Get-AuthenticodeSignature $setup.FullName).Status -eq 'Valid' -and (Get-AuthenticodeSignature dist\PhanTrang.exe).Status -eq 'Valid'
          [IO.File]::WriteAllText("$PWD\dist\release\phien-ban.json", ($info | ConvertTo-Json -Depth 4), (New-Object Text.UTF8Encoding $false))

      # Microsoft Store package. The Store signs it when it is accepted, so it is not signed here.
      # Set the repository variables STORE_IDENTITY_NAME, STORE_PUBLISHER, STORE_PUBLISHER_NAME (Partner Center >
      # Product identity) to get a package the Store accepts; without them it carries a test identity.
      - name: Store package (MSIX)
        shell: powershell
        env:
          ID: ${{ vars.STORE_IDENTITY_NAME }}
          PUB: ${{ vars.STORE_PUBLISHER }}
          PUBNAME: ${{ vars.STORE_PUBLISHER_NAME }}
          DN: ${{ vars.STORE_DISPLAY_NAME }}
        run: |
          $name = if ($env:DN) { $env:DN } else { $env:PUBNAME }   # display name: one of the names reserved in Partner Center
          if ($env:ID) { powershell -ExecutionPolicy Bypass -File pack-msix.ps1 -IdentityName $env:ID -Publisher $env:PUB -PublisherName $env:PUBNAME -DisplayName $name }
          else { powershell -ExecutionPolicy Bypass -File pack-msix.ps1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: PhanTrang-${{ github.sha }}
          path: |
            dist/release/*.exe
            dist/release/*.zip
            dist/release/*.msix
            dist/release/phien-ban.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist\release -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object { $_.FullName }   # only what teachers download
          # the notes written for this version (release-notes\v1.3.0.md …), else GitHub's list of changes
          # ({{SHA256}} in the notes becomes the checksums of the files just built)
          $notes = "release-notes\${{ github.ref_name }}.md"
          if (Test-Path $notes) {
            $sums = ($files | ForEach-Object { "{0,-30} {1}" -f (Split-Path $_ -Leaf), (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower() }) -join "`n"
            $body = (Get-Content $notes -Raw -Encoding UTF8).Replace('{{SHA256}}', $sums)
            [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.md", $body, (New-Object Text.UTF8Encoding($false)))
            gh release create "${{ github.ref_name }}" $files --title "Phấn Trắng ${{ github.ref_name }}" --notes-file "$env:RUNNER_TEMP\notes.md"
          }
          else { gh release create "${{ github.ref_name }}" $files --title "Phấn Trắng ${{ github.ref_name }}" --generate-notes }
